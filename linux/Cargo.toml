[package]
name = "jafnify-linux"
version = "0.1.4"
edition = "2021"
license = "MIT"
description = "Jafnify P2P tunnel -- Linux GUI and CLI frontend"

[features]
# Side-by-side test install ("jafnify-test"); see src/flavor.rs.
test-flavor = []

[dependencies]
jafnify-core = { path = "../jafnify-core" }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "5"
eframe = "0.37"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
regex = "1"
socket2 = { version = "0.5", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
zbus = "5"
neli-wifi = "0.6.1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "jafnify"
path = "src/bin/jafnify.rs"

[[bin]]
name = "jafnify-gui"
path = "src/bin/jafnify-gui.rs"

[[bin]]
name = "jafnify-helper"
path = "src/bin/jafnify-helper.rs"
