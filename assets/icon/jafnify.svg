<?xml version="1.0" encoding="UTF-8"?>
<!-- The J-Signal mark: a stroked J with two ember signal arcs at its top end.
     Mirrors design/tokens.toml [dark].surface (tile), [dark].fg (J) and
     [dark].accent (arcs). This file is the single source every platform copies:
     the Linux rasteriser parses it at build time. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect x="2" y="2" width="60" height="60" rx="13" fill="#17191C"/>
  <path fill="none" stroke="#E6E8EB" stroke-width="7" stroke-linecap="round"
        stroke-linejoin="round" d="M40 16 V36 C40 45 35 50 27 50 C23 50 19 48 18 44"/>
  <path fill="none" stroke="#FF5C6C" stroke-width="5.5" stroke-linecap="round"
        d="M50 16 A10 10 0 0 0 47.07 8.93"/>
  <path fill="none" stroke="#FF5C6C" stroke-width="5.5" stroke-linecap="round"
        d="M57 16 A17 17 0 0 0 52.02 3.98"/>
</svg>
